  # ════════════════════════════════════════════════════════════════════════════

  - model_name: glm-flash                      # fast + cheap
    litellm_params:
      model: zai/glm-4-flash
      api_key: os.environ/ZAI_API_KEY

  - model_name: glm-plus
    litellm_params:
      model: zai/glm-4-plus
      api_key: os.environ/ZAI_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # MINIMAX
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: minimax-fast
    litellm_params:
      model: minimax/MiniMax-M2.1-lightning
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimax.io/v1

  - model_name: minimax-pro
    litellm_params:
      model: minimax/MiniMax-M2.1
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimax.io/v1

  # ════════════════════════════════════════════════════════════════════════════
  # VOLCENGINE / BYTEDANCE (DOUBAO)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: doubao-pro
    litellm_params:
      model: volcengine/doubao-pro-4k
      api_key: os.environ/VOLCENGINE_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # MODELSCOPE
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: modelscope-qwen
    litellm_params:
      model: modelscope/qwen2.5-72b-instruct
      api_key: os.environ/MODELSCOPE_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # AWS BEDROCK
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: bedrock-claude-haiku
    litellm_params:
      model: bedrock/anthropic.claude-3-5-haiku-20241022-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: bedrock-claude-sonnet
    litellm_params:
      model: bedrock/anthropic.claude-sonnet-4-20250514-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  # ════════════════════════════════════════════════════════════════════════════
  # AZURE OPENAI
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: azure-gpt4o
    litellm_params:
      model: azure/gpt-4o
      api_key: os.environ/AZURE_API_KEY
      api_base: os.environ/AZURE_API_BASE
      api_version: os.environ/AZURE_API_VERSION

  # ════════════════════════════════════════════════════════════════════════════
  # IBM WATSONX
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: watsonx-granite
    litellm_params:
      model: watsonx/ibm/granite-13b-chat-v2
      api_key: os.environ/WATSONX_API_KEY
      watsonx_url: os.environ/WATSONX_URL
      watsonx_project_id: os.environ/WATSONX_PROJECT_ID

  # ════════════════════════════════════════════════════════════════════════════
  # LOCAL — OLLAMA  (no API key, must be running on host)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: ollama-llama
    litellm_params:
      model: ollama/llama3.2
      api_base: http://host.docker.internal:11434

  - model_name: ollama-qwen
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://host.docker.internal:11434

  # ════════════════════════════════════════════════════════════════════════════
  # LOCAL — LM STUDIO  (no API key, must be running on host)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: lmstudio-local
    litellm_params:
      model: lm_studio/loaded-model
      api_base: http://host.docker.internal:1234

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  return_response_headers: true
