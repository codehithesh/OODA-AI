  # ════════════════════════════════════════════════════════════════════════════
  # DEEPINFRA
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: deepinfra-llama
    litellm_params:
      model: deepinfra/meta-llama/Meta-Llama-3.1-70B-Instruct
      api_key: os.environ/DEEPINFRA_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # NVIDIA NIM  (free credits on signup)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: nvidia-llama
    litellm_params:
      model: nvidia_nim/meta/llama-3.1-70b-instruct
      api_key: os.environ/NVIDIA_NIM_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # HUGGING FACE
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: hf-llama
    litellm_params:
      model: huggingface/meta-llama/Meta-Llama-3.1-70B-Instruct
      api_key: os.environ/HUGGINGFACE_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # DEEPSEEK  (5M free tokens on signup)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: deepseek-chat                  # DeepSeek-V3
    litellm_params:
      model: deepseek/deepseek-chat
