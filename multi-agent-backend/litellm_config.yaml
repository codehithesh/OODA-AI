# LiteLLM proxy configuration — one unified OpenAI-compatible endpoint for
# every provider. The backend only ever talks to this proxy via
# LITELLM_BASE_URL + DEFAULT_MODEL ("agent-default" below).
#
# HOW TO ACTIVATE A PROVIDER
# ───────────────────────────
# 1. Set the corresponding key(s) in your .env file.
# 2. Uncomment the model_list entries below for that provider.
# 3. Make sure only ONE "agent-default" entry is active at a time.
# 4. Restart LiteLLM:  docker compose restart litellm
#
# Full provider list: https://docs.litellm.ai/docs/providers

