# LiteLLM proxy configuration
#
# Every model has a UNIQUE alias (model_name). The backend picks one via
# DEFAULT_MODEL in .env. Set DEFAULT_MODEL to any alias below.
#
# Models whose provider key is blank in .env will return auth errors —
# just leave those entries here; they won't affect other models.
#
# After editing: docker compose restart litellm

model_list:

  # ════════════════════════════════════════════════════════════════════════════
  # OPENROUTER  (one key → 200+ models, including free :free variants)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: openrouter-llama-free          # free, no spend needed
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-deepseek-free       # free DeepSeek R1
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-qwen-free           # free Qwen3 235B
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-gemma-free          # free Google Gemma 3
    litellm_params:
      model: openrouter/google/gemma-3-27b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-claude-sonnet       # paid — Anthropic via OR
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-gpt4o               # paid — OpenAI via OR
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-kimi                # paid — Kimi K2 via OR
    litellm_params:
      model: openrouter/moonshotai/kimi-k2
      api_key: os.environ/OPENROUTER_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # ANTHROPIC
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: anthropic-haiku
    litellm_params:
      model: anthropic/claude-haiku-3-5-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # OPENAI
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: openai-gpt4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai-gpt4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai-o3
    litellm_params:
      model: openai/o3
      api_key: os.environ/OPENAI_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # XAI / GROK
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: xai-grok-mini
    litellm_params:
      model: xai/grok-3-mini
      api_key: os.environ/XAI_API_KEY

  - model_name: xai-grok
    litellm_params:
      model: xai/grok-4.5
      api_key: os.environ/XAI_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # GOOGLE GEMINI  (free tier: 1,500 req/day, no credit card)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: gemini-flash                   # free tier available
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash-25                # free tier available
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # GROQ  (free forever: 14,400 req/day, no credit card)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: groq-llama                     # free
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: groq-llama-fast                # free, smaller/faster
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # MISTRAL
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: mistral-small
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mistral-large
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mistral-magistral              # reasoning model
    litellm_params:
      model: mistral/magistral-medium-2506
      api_key: os.environ/MISTRAL_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # PERPLEXITY  (online / web-search models)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: perplexity-online
    litellm_params:
      model: perplexity/llama-3.1-sonar-large-128k-online
      api_key: os.environ/PERPLEXITYAI_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # COHERE
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: cohere-command-r
    litellm_params:
      model: cohere_chat/command-r
      api_key: os.environ/COHERE_API_KEY

  - model_name: cohere-command-r-plus
    litellm_params:
      model: cohere_chat/command-r-plus
      api_key: os.environ/COHERE_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # CEREBRAS  (free tier available)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: cerebras-llama                 # free tier
    litellm_params:
      model: cerebras/llama3.1-70b
      api_key: os.environ/CEREBRAS_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # SAMBANOVA  (free forever)
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: sambanova-llama                # free
    litellm_params:
      model: sambanova/Meta-Llama-3.3-70B-Instruct
      api_key: os.environ/SAMBANOVA_API_KEY

  - model_name: sambanova-llama-405b           # free
    litellm_params:
      model: sambanova/Meta-Llama-3.1-405B-Instruct
      api_key: os.environ/SAMBANOVA_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # FIREWORKS AI
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: fireworks-llama
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/llama-v3p3-70b-instruct
      api_key: os.environ/FIREWORKS_AI_API_KEY

  # ════════════════════════════════════════════════════════════════════════════
  # TOGETHER AI
  # ════════════════════════════════════════════════════════════════════════════

  - model_name: together-llama
    litellm_params:
