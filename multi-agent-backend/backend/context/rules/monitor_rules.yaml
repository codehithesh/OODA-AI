# Monitor agent rules — detection thresholds, taxonomy, action matrix.
detection:
  - {metric: error_rate,      op: gt, threshold: 0.05,  kind: error_burst,        severity: critical}
  - {metric: latency_p95_ms,  op: gt, threshold: 1000,  kind: latency_spike,      severity: high}
  - {metric: cpu_percent,     op: gt, threshold: 90,    kind: resource_exhaustion, severity: medium}
  - {metric: queue_depth,     op: gt, threshold: 1000,  kind: backlog_growth,     severity: medium}
  - {metric: disk_free_percent, op: lt, threshold: 5,   kind: capacity_exhaustion, severity: low}

unstructured_default:
  kind: unclassified
  severity: medium

taxonomy: [error_burst, latency_spike, resource_exhaustion, backlog_growth, capacity_exhaustion, data_drift, unclassified]
severities: [low, medium, high, critical]

# First matching entry wins; entries may filter by kinds, severities, or both.
action_matrix:
  - severities: [critical]
    action: require_approval
    plan: {type: page_oncall, channel: "#incidents", runbook: "https://runbooks.example/critical-signal"}
  - severities: [high]
    action: require_approval
    plan: {type: notify, channel: "#ops-alerts", runbook: "https://runbooks.example/high-signal"}
  - kinds: [data_drift]
    action: require_approval
    plan: {type: notify, channel: "#data-quality", runbook: "https://runbooks.example/data-drift"}
  - severities: [medium]
    action: auto_act
    plan: {type: notify, channel: "#ops-bots", runbook: ""}
  - severities: [low]
    action: ignore
    plan: {type: log_only, channel: "", runbook: ""}

default_action:
  action: require_approval
  plan: {type: notify, channel: "#ops-alerts", runbook: ""}
