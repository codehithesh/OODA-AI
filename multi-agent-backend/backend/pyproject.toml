[project]
name = "multi-agent-backend"
version = "0.1.0"
description = "Multi-agent LLM backend: FastAPI + LangGraph + PostgreSQL checkpoints + DuckDB analytics, OpenAI-compatible for Open WebUI."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "psycopg[binary]>=3.1.18",
    "alembic==1.19.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "httpx==0.28.1",
    "redis==8.1.0",
    "duckdb==1.5.5",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "langfuse==2.60.10",
    "sentry-sdk==2.68.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["analysis_state", "benchmark", "config", "database", "eval_harness", "main", "models", "observability", "schemas"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nodes*", "graphs*", "routes*", "clients*", "tools*"]
exclude = ["data*", "context*", "alembic*", "tests*"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends(...) in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.ruff.format]
docstring-code-format = true
